name: Pubblica su GitHub Pages

# A ogni push su main: controlla il sito e, se il controllo passa, pubblica la cartella public/.
# Richiede una volta: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Pagine allineate al generatore
        run: node scripts/build-pages.mjs && git diff --exit-code -- public
      - name: Controllo del sito
        run: node scripts/check.mjs
      - name: Prepara la cartella da pubblicare
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
