name: Controllo sito

# Parte a ogni push su qualsiasi branch e a ogni pull request:
# verifica pagine, script, link e Content-Security-Policy. Non pubblica nulla.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Pagine allineate al generatore
        run: node scripts/build-pages.mjs && git diff --exit-code -- public
      - name: Controllo del sito
        run: node scripts/check.mjs
