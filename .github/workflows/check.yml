name: Controllo sito

# Parte a ogni push su qualsiasi branch e a ogni pull request:
# verifica pagine, script, link e Content-Security-Policy. Non pubblica nulla.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Controllo del sito
        run: node scripts/check.mjs
